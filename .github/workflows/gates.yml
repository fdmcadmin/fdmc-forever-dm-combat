# THE GATES — every check that has to pass before anything ships.
#
# This is the "GitHub CI · build / parity / gates" box in the architecture diagram, and until
# now it did not exist: the repo had no .github/workflows at all. Every gate below has been
# running only on Christopher's machine, by hand, which means a push from anywhere else — and
# in particular a push from the extension's author button — landed unverified.
#
# ORDER IS DELIBERATE. The cheap, broad failures run first so a bad commit fails in seconds
# rather than after a full build:
#   1. encoding scan   — mojibake, which corrupts campaign text silently (runs inside prebuild)
#   2. tsc + vite      — the build itself
#   3. the checks      — behaviour: bonds, storage, slots, monsters, act run
#   4. trait coverage  — every multiplier can say where it came from
#   5. trait reader    — the prose reader disagrees with nobody
#   6. baseline        — no published number moved without being accepted
#
# The baseline is last because it is the one that fails on a CHANGE rather than a fault. Read
# its diff, and if every line is intended, run `npm run baseline:accept` and commit the result
# alongside the change that caused it.

name: gates

on:
  push:
    branches: ["**"]
    # ⚠ A PUBLISH IS NOT A SOURCE CHANGE, AND RUNNING BOTH WORKFLOWS ON IT IS WORSE THAN WASTEFUL.
    # `fold-authoring` runs this same gate set against the FOLDED tree, which is the tree that
    # matters. Running here as well tests the payload UNFOLDED — a green run that proves nothing
    # about the content, sitting next to the one that does. A push touching source as well as the
    # payload still runs, because paths-ignore only skips when EVERY changed file matches.
    paths-ignore:
      - "authoring/**"
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the contract, and a CI run that
      # quietly resolves a different tree is not testing what ships.
      - run: npm ci

      # prebuild runs sync-manifest-version + scan-encoding; build runs tsc -b + vite build.
      - name: build
        run: npm run build

      - name: check bonds
        run: npm run check:bonds

      - name: check storage
        run: npm run check:storage

      - name: check spell slot picks
        run: npm run check:slots

      - name: check monster resolution
        run: npm run check:monsters

      - name: check act run
        run: npm run check:actrun

      - name: check trait coverage
        run: npm run check:traits

      - name: check trait reader
        run: npm run check:reader

      - name: check party healing
        run: npm run check:healing

      - name: check party fit
        run: npm run check:partyfit

      - name: check encounter repair
        run: npm run check:encrepair

      - name: check monster saves
        run: npm run check:saves

      - name: check monster formulas
        run: npm run check:formulas

      - name: check damage responses
        run: npm run check:responses

      - name: check import shapes
        run: npm run check:imports

      - name: check loot pool names
        run: npm run check:pools

      - name: check save DCs
        run: npm run check:savedcs

      - name: check multiattack and riders
        run: npm run check:multiattack

      - name: check reaction economy
        run: npm run check:reactions

      - name: check item activation
        run: npm run check:activation

      - name: check summons
        run: npm run check:summons

      # Fails on any published number that moved. Not a bug report — read the diff.
      - name: check baseline
        run: npm run check:baseline
