# AUTHOR BUTTON → REPO, without a download and without a hand-off.
#
# Christopher: *"the reason i dont want a download and a hand to you is because if small changes
# like moving hp, moving ac, or even creating each creature for act 4 then handing them to you is
# what burns usage."*
#
# Exactly right, and none of that work needs a person. The extension writes ONE file —
# `authoring/current.json`, the same payload the download produced — and this workflow does what
# a hand-off used to:
#
#   1. fold it into `src/data/broken-chain/authored.generated.ts`
#   2. run every gate against the folded result
#   3. commit the generated file back, but ONLY if the gates passed
#
# ⚠ THE GATES ARE THE POINT, NOT THE COMMIT. A fold that builds green is a fold that is safe to
# ship; a fold that is not gets left on the branch with a red run and nothing is written back.
# `fold-authoring` already refuses outright when an encounter names a creature that is in neither
# the payload nor the bundled library — the case that would have shipped two rebuilt Act 3 fights
# EMPTY — so that failure surfaces here as a failed step rather than a silent gap in play.
#
# ⚠ IT COMMITS TO WHEREVER THE PAYLOAD ARRIVED, then promotes that to main when every gate passed.
# The branch is re-cut from main by the author button immediately before the payload is written, so
# it can never be behind and the promotion is always a fast-forward — see the note at the foot of
# this file. A library change is not an app change and must never wait on one.

name: fold-authoring

on:
  push:
    paths:
      - "authoring/*.json"
  workflow_dispatch:
    inputs:
      payload:
        description: "Path to the authoring payload"
        required: false
        default: "authoring/current.json"

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-back step needs the branch, not a detached HEAD.
          ref: ${{ github.ref_name }}
          # ⚠ FULL HISTORY. The rebase-and-retry below needs real history to rebase onto, and the
          # retired triage step died on a shallow clone with "fatal: origin/main...HEAD: no merge
          # base" AFTER the fold had committed — stranding the work under a red run.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: fold the authoring payload
        run: node scripts/fold-authoring.mjs "${{ github.event.inputs.payload || 'authoring/current.json' }}"

      # Everything below is the same gate set as gates.yml, run against the FOLDED tree. If the
      # DM's authoring breaks a check, this is where it stops.
      - name: build
        run: npm run build

      - name: checks
        run: |
          npm run check:bonds
          npm run check:storage
          npm run check:slots
          npm run check:monsters
          npm run check:actrun
          npm run check:traits
          npm run check:reader
          npm run check:healing
          npm run check:partyfit
          npm run check:encrepair
          npm run check:formulas
          npm run check:responses
          npm run check:imports
          npm run check:pools
          npm run check:savedcs
          npm run check:multiattack
          npm run check:reactions
          npm run check:activation
          npm run check:summons
          npm run check:summontracker
          npm run check:hppatch
          npm run check:resourcecost
          npm run check:armedattack
          npm run check:timed

      # ⚠ NOT a gate here, deliberately. Folding authored content is EXPECTED to move published
      # numbers — that is what authoring is. The baseline is re-recorded so the diff lands in the
      # same commit as the content that caused it, which is where it is readable.
      - name: re-record the baseline and the saves
        run: |
          npm run baseline:accept
          npx tsx scripts/check-monster-saves.ts --record

      - name: commit the folded result
        run: |
          git config user.name "fdmc-author-bot"
          git config user.email "noreply@anthropic.com"
          git add src/data/broken-chain/authored.generated.ts scripts/baseline.json scripts/monster-saves.json
          if git diff --cached --quiet; then
            echo "nothing to commit — the fold produced no change"
            exit 0
          fi
          git commit -m "fold authoring $(date -u +%Y-%m-%dT%H:%MZ) — gates green"
          # ⚠ A PUSH LANDING WHILE THE FOLD RAN MUST NOT STRAND THE DM'S WORK. The fold takes
          # ~45s; a source commit arriving in that window used to reject the push and leave the
          # authoring unfolded, which is the whole class of failure this workflow exists to end.
          # Rebasing keeps the generated result on top of whatever main became.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "main moved under us — rebasing and retrying"
            git pull --rebase origin ${{ github.ref_name }} || exit 1
          done
          echo "could not push after three attempts"
          exit 1

      # ── PROMOTION, WITHOUT A PERSON IN IT ──────────────────────────────────────────────────
      #
      # Christopher: *"Do not require me to manually promote every passing authoring change [...]
      # Human approval should only be required for explicit architecture/source-of-truth changes
      # or release-level exceptions, not routine passing updates."*
      #
      # Everything above already passed, against the FOLDED tree, so there is nothing left for a
      # person to decide. This fast-forwards main to the folded result.
      #
      # ⚠ WHY THIS CAN FAST-FORWARD AT ALL, WHEN IT NEVER USED TO. The author button now RE-CUTS
      # this branch from main immediately before writing the payload, so at the moment the run
      # started the branch was main plus one data commit. The old failure — *"when you change
      # things and push a version it then voids my publish and i have to delete the authoring and
      # remake it"* — was a long-lived branch drifting behind by one commit per app push, which
      # can never fast-forward. A branch re-cut on every publish cannot drift.
      #
      # If main moved DURING the run, rebase onto it and retry. A payload commit and a source
      # commit touch different files, so this is a clean replay rather than a merge to resolve.
      - name: promote to ${{ github.event.repository.default_branch }}
        if: github.ref_name != github.event.repository.default_branch
        env:
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$MAIN"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$MAIN"; then
              echo "promoted on attempt $attempt — every gate passed, so nothing waited on a person"
              exit 0
            fi
            echo "$MAIN moved under us — rebasing and retrying"
            git fetch origin "$MAIN" || exit 1
            git rebase "origin/$MAIN" || {
              echo "the rebase did not apply cleanly. The authoring is safe on this branch; nothing was merged."
              exit 1
            }
          done
          echo "could not promote after three attempts — the authoring is safe on this branch"
          exit 1
